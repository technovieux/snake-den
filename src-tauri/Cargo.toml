[package]
name = "snakeden"
version = "0.1.0"
description = "SnakeDen - a modern VM launcher"
authors = ["SnakeDen"]
edition = "2021"

[lib]
name = "snakeden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["stream"] }
futures-util = "0.3"
tokio-util = "0.7"
libc = "0.2"
